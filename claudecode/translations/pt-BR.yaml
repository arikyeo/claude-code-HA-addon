configuration:
  enable_mcp:
    name: Habilitar MCP do Home Assistant
    description: >-
      Habilita o servidor MCP do Home Assistant para interação direta com
      entidades e serviços pelo Claude Code. Permite que o Claude consulte
      estados, chame serviços e interaja com sua casa inteligente.
  enable_playwright_mcp:
    name: Habilitar MCP Playwright
    description: >-
      Habilita o servidor MCP Playwright para automação de navegador. Requer o
      add-on "Playwright Browser" instalado e em execução. Permite que o Claude
      navegue em páginas web, preencha formulários, clique em elementos e tire
      screenshots.
  playwright_cdp_host:
    name: Host CDP do Playwright
    description: >-
      Nome do host do add-on Playwright Browser para conexão CDP. Deixe vazio
      para o padrão (playwright-browser). Se a conexão falhar, verifique o
      nome do host do container Playwright Browser (ex: 1016f397-playwright-browser).
  terminal_font_size:
    name: Tamanho da Fonte do Terminal
    description: >-
      Tamanho da fonte do terminal web em pixels (10-24).
      Ajuste para melhor legibilidade no seu monitor.
  terminal_theme:
    name: Tema do Terminal
    description: >-
      Tema de cores do terminal web.
      Escolha 'dark' para fundo escuro ou 'light' para fundo claro.
  working_directory:
    name: Diretório de Trabalho
    description: >-
      O diretório padrão quando o Claude Code inicia.
      Use /homeassistant para acesso direto aos arquivos de configuração do HA.
  session_persistence:
    name: Persistência de Sessão
    description: >-
      Habilita persistência de sessão via tmux. Quando habilitado, sua sessão
      do terminal sobrevive a atualizações do navegador e desconexões.
      Recomendado para tarefas de longa duração.
  auto_update_claude:
    name: Atualização Automática do Claude Code
    description: >-
      Atualiza o Claude Code para a versão mais recente a cada início do add-on. O Claude
      Code é instalado em armazenamento persistente (desacoplado da imagem do add-on),
      então permanece atualizado sem precisar mudar a versão do add-on.
  auto_start_claude:
    name: Iniciar o Claude Code Automaticamente
    description: >-
      Inicia o Claude Code automaticamente ao abrir o terminal, então não há nada para
      digitar após uma reinicialização. Saia do Claude para cair em um shell; a sessão persiste.
  claude_skip_permissions:
    name: Pular Confirmações de Permissão
    description: >-
      Inicia o Claude com --dangerously-skip-permissions (e IS_SANDBOX=1) para que ele
      possa ler/alterar arquivos e chamar serviços sem perguntar a cada vez. Desative para
      um fluxo mais seguro que pede confirmação antes de agir. Use com cuidado.
  claude_extra_args:
    name: Argumentos Extras do Claude
    description: >-
      Opções de linha de comando adicionais anexadas ao comando de inicialização do Claude,
      por exemplo "--model opus". Deixe vazio para nenhuma.
  enable_chat_ui:
    name: Habilitar Interface de Chat CloudCLI
    description: >-
      Também executa o CloudCLI, uma interface de chat web para Claude Code amigável
      para celulares, na porta 3001 (abra http://SEU-IP-HA:3001). Reutiliza seu login do
      Claude e o acesso ao HA, e tem seu próprio login. Desativado por padrão; o terminal
      não é afetado. Requer Node 22+.

network:
  7681/tcp: Terminal Web (ttyd)
  3001/tcp: Interface de Chat CloudCLI (quando enable_chat_ui está ativo)
