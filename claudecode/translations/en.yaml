configuration:
  enable_mcp:
    name: Enable Home Assistant MCP
    description: >-
      Enable the Home Assistant MCP server for direct entity and service
      interaction from Claude Code. Allows Claude to query states, call services,
      and interact with your smart home.
  enable_playwright_mcp:
    name: Enable Playwright MCP
    description: >-
      Enable the Playwright MCP server for browser automation. Requires the
      "Playwright Browser" add-on to be installed and running. Allows Claude to
      navigate web pages, fill forms, click elements, and take screenshots.
  playwright_cdp_host:
    name: Playwright CDP Host
    description: >-
      Hostname of the Playwright Browser add-on for CDP connection. Leave empty
      for default (playwright-browser). If connection fails, check the Playwright
      Browser container hostname (e.g., 1016f397-playwright-browser).
  terminal_font_size:
    name: Terminal Font Size
    description: >-
      Font size for the web terminal in pixels (10-24).
      Adjust for readability on your display.
  terminal_theme:
    name: Terminal Theme
    description: >-
      Color theme for the web terminal.
      Choose 'dark' for dark backgrounds or 'light' for light backgrounds.
  working_directory:
    name: Working Directory
    description: >-
      The default working directory when Claude Code starts.
      Use /homeassistant for direct access to HA configuration files.
  session_persistence:
    name: Session Persistence
    description: >-
      Enable tmux session persistence. When enabled, your terminal session
      survives browser refreshes and disconnects. Recommended for long-running tasks.
  auto_update_claude:
    name: Auto-update Claude Code
    description: >-
      Update Claude Code to the latest version on every add-on start. Claude Code
      is installed in persistent storage (decoupled from the add-on image), so it
      stays current without requiring add-on version bumps.
  auto_start_claude:
    name: Auto-start Claude Code
    description: >-
      Launch Claude Code automatically when the terminal opens, so there is nothing
      to type after a reboot. Exit Claude to drop to a shell; the session persists.
  claude_skip_permissions:
    name: Skip Permission Prompts
    description: >-
      Start Claude with --dangerously-skip-permissions (and IS_SANDBOX=1) so it can
      read/change files and call services without asking each time. Disable for a
      safer prompt-before-acting flow. Use with care.
  claude_extra_args:
    name: Extra Claude Arguments
    description: >-
      Additional command-line flags appended to the auto-started Claude command,
      e.g. "--model opus". Leave empty for none.
  enable_chat_ui:
    name: Enable CloudCLI Chat UI
    description: >-
      Also run CloudCLI, a mobile-friendly chat web UI for Claude Code, on port 3001
      (open http://YOUR-HA-IP:3001). Reuses your existing Claude login and HA access and
      has its own web login. Off by default; the terminal is unaffected. Needs Node 22+.

network:
  7681/tcp: Web Terminal (ttyd)
  3001/tcp: CloudCLI Chat UI (when enable_chat_ui is on)
