name: CI

# Lightweight checks for the add-ons:
#   - lint:  validates each add-on's config.yaml/schema with the official HA linter
#   - build: does an amd64 "test" build of the Claude Code image (no push) so any
#            Dockerfile breakage is caught on every pull request.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint ${{ matrix.addon }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        addon:
          - claudecode
          - playwright-browser
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Advisory only (continue-on-error): the official linter is strict and flags
      # keys set to their default value — including `init: true`, which this repo
      # deliberately sets (Docker's tini instead of s6-overlay) and documents in
      # CLAUDE.md. It is also a Docker-based action that can flake while pulling its
      # own base image from Docker Hub. Keep it as PR feedback; the Docker build
      # below is the gating check.
      - name: Home Assistant add-on linter
        continue-on-error: true
        uses: frenck/action-addon-linter@v2
        with:
          path: "./${{ matrix.addon }}"

  build:
    name: Build claudecode image (amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Plain `docker build` of the add-on Dockerfile for amd64 (no push) — the
      # gating check that catches Dockerfile / package / download breakage. We pass
      # the same BUILD_FROM / BUILD_ARCH the HA Supervisor injects, instead of the HA
      # builder action (which insists on a registry image name this locally-built
      # add-on intentionally doesn't define).
      - name: Build claudecode image
        run: |
          docker build \
            --build-arg BUILD_FROM=ghcr.io/home-assistant/amd64-base-python:3.13-alpine3.21 \
            --build-arg BUILD_ARCH=amd64 \
            -t local/claudecode:ci \
            ./claudecode
