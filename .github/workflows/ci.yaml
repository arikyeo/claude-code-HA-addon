name: CI

# Lightweight checks for the add-ons:
#   - lint:  validates each add-on's config.yaml/schema with the official HA linter (advisory)
#   - build: amd64 "test" build of the Claude Code image via the official HA builder
#            (no push) so Dockerfile breakage is caught on every pull request.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint ${{ matrix.addon }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        addon:
          - claudecode
          - playwright-browser
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Advisory only (continue-on-error): the official linter is strict and flags
      # keys set to their default value — including `init: true`, which this repo
      # deliberately sets (Docker's tini instead of s6-overlay) and documents in
      # CLAUDE.md. It is also a Docker-based action that can flake while pulling its
      # own base image from Docker Hub. Keep it as PR feedback; the Docker build
      # below is the gating check.
      - name: Home Assistant add-on linter
        continue-on-error: true
        uses: frenck/action-addon-linter@v2
        with:
          path: "./${{ matrix.addon }}"

  build:
    name: Build claudecode image (amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Build the add-on the way Home Assistant does, via the official builder image.
      # Its Dockerfile frontend parses the `RUN cat > file <<'EOF'` heredocs that a
      # plain `docker build` rejects without a `# syntax=` directive (that's how this
      # add-on already ships). --test builds without pushing. This add-on has no
      # `image:` field and the builder forms "<docker-hub>/<image>:<version>", so an
      # empty docker-hub produces an invalid "/...:" tag — we set --docker-hub and
      # --image purely to give the local test build a valid name.
      - name: Build claudecode image (test, no push)
        uses: home-assistant/builder@master
        with:
          args: |
            --test \
            --amd64 \
            --docker-hub local \
            --image {arch}-claudecode \
            --target claudecode \
            --addon
