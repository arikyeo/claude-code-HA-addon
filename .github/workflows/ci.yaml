name: CI

# Lightweight checks for the add-ons:
#   - lint:  validates each add-on's config.yaml/schema with the official HA linter
#   - build: does an amd64 "test" build of the Claude Code image (no push) so any
#            Dockerfile breakage is caught on every pull request.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint ${{ matrix.addon }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        addon:
          - claudecode
          - playwright-browser
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Advisory only (continue-on-error): the official linter is strict and flags
      # keys set to their default value — including `init: true`, which this repo
      # deliberately sets (Docker's tini instead of s6-overlay) and documents in
      # CLAUDE.md. It is also a Docker-based action that can flake while pulling its
      # own base image from Docker Hub. Keep it as PR feedback; the Docker build
      # below is the gating check.
      - name: Home Assistant add-on linter
        continue-on-error: true
        uses: frenck/action-addon-linter@v2
        with:
          path: "./${{ matrix.addon }}"

  build:
    name: Build ${{ matrix.addon }} (amd64)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        addon:
          - claudecode
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Builds the image locally for amd64 without pushing. Uses the add-on's
      # build.yaml (base image) + Dockerfile, so it fails if the Dockerfile,
      # package installs, or downloads break.
      - name: Build add-on image (test, no push)
        uses: home-assistant/builder@master
        with:
          # --image gives the test build a valid tag. This add-on has no `image:`
          # field (it builds locally on each HA, it isn't published to a registry),
          # so without this the builder produces an invalid empty tag "/:<version>".
          # {arch} is substituted by the builder; nothing is pushed in --test mode.
          args: |
            --test \
            --amd64 \
            --image local/{arch}-${{ matrix.addon }} \
            --target ${{ matrix.addon }} \
            --addon
